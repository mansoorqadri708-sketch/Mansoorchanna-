---
layout: default
title: Events Calendar
permalink: /events/
---

<div class="events-container">
    <h1 class="page-title">📅 Events Calendar</h1>
    
    <!-- Calendar Section -->
    <div class="calendar-section">
        <div class="calendar-header">
            <button class="month-nav" onclick="changeMonth(-1)">←</button>
            <h2 id="currentMonth">February 2026</h2>
            <button class="month-nav" onclick="changeMonth(1)">→</button>
        </div>
        
        <div class="calendar-grid" id="calendar">
            <!-- Calendar will be generated by JavaScript -->
        </div>
    </div>

    <!-- Events List Section -->
    <div class="events-list-section">
        <h2>📋 Upcoming Events</h2>
        <div id="eventsList" class="events-list">
            <!-- Events will be loaded here -->
        </div>
    </div>

    <!-- Photo Gallery from D:/Mansoor-photos -->
    <div class="photo-section">
        <h2>🖼️ Event Photos</h2>
        <div class="photo-grid" id="eventPhotos">
            <!-- Photos will be loaded here -->
        </div>
    </div>
</div>

<!-- Calendar and Events JavaScript -->
<script>
// Calendar Configuration
let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();

// Sample Events Data (replace with your actual events)
const events = [
    {
        date: '2026-02-15',
        title: 'Annual Mahfil',
        time: '7:00 PM',
        location: 'Main Hall',
        description: 'Annual spiritual gathering',
        photos: ['mahfil1.jpg', 'mahfil2.jpg']
    },
    {
        date: '2026-02-20',
        title: 'Gallery Opening',
        time: '3:00 PM',
        location: 'Art Space',
        description: 'New exhibition opening',
        photos: ['gallery1.jpg', 'gallery2.jpg']
    },
    {
        date: '2026-02-25',
        title: 'Community Event',
        time: '5:30 PM',
        location: 'Community Center',
        description: 'Monthly community gathering',
        photos: ['community1.jpg']
    }
];

// Function to load photos from D:/Mansoor-photos
async function loadPhotosFromDrive() {
    // Note: Browser security prevents direct access to local drives
    // This is a simulated version - you'll need to upload photos to your site
    
    const photoGrid = document.getElementById('eventPhotos');
    
    // Sample photo data - replace with your actual uploaded photos
    const photos = [
        { name: 'event1.jpg', title: 'Event 2026', date: '2026-02-01' },
        { name: 'event2.jpg', title: 'Mahfil Night', date: '2026-02-05' },
        { name: 'event3.jpg', title: 'Gallery View', date: '2026-02-10' },
        { name: 'event4.jpg', title: 'Community Meet', date: '2026-02-15' },
        { name: 'event5.jpg', title: 'Special Event', date: '2026-02-20' },
        { name: 'event6.jpg', title: 'Celebration', date: '2026-02-25' }
    ];
    
    photos.forEach(photo => {
        const photoItem = document.createElement('div');
        photoItem.className = 'photo-item';
        photoItem.innerHTML = `
            <img src="/assets/images/events/${photo.name}" 
                 alt="${photo.title}"
                 onerror="this.src='/assets/images/placeholder.jpg'">
            <div class="photo-info">
                <h4>${photo.title}</h4>
                <p>${photo.date}</p>
            </div>
        `;
        photoGrid.appendChild(photoItem);
    });
}

// Generate Calendar
function generateCalendar(month, year) {
    const calendar = document.getElementById('calendar');
    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
    
    document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
    
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    let calendarHTML = '<div class="weekdays">';
    const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    weekdays.forEach(day => {
        calendarHTML += `<div class="weekday">${day}</div>`;
    });
    calendarHTML += '</div><div class="days">';
    
    // Empty cells for days before month starts
    for (let i = 0; i < firstDay; i++) {
        calendarHTML += '<div class="day empty"></div>';
    }
    
    // Fill in the days
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const hasEvent = events.some(event => event.date === dateStr);
        const eventClass = hasEvent ? 'has-event' : '';
        
        calendarHTML += `
            <div class="day ${eventClass}" data-date="${dateStr}">
                ${day}
                ${hasEvent ? '<span class="event-dot"></span>' : ''}
            </div>
        `;
    }
    
    calendarHTML += '</div>';
    calendar.innerHTML = calendarHTML;
    
    // Add click events to days
    document.querySelectorAll('.day[data-date]').forEach(day => {
        day.addEventListener('click', function() {
            const selectedDate = this.dataset.date;
            showEventsForDate(selectedDate);
        });
    });
}

// Show events for selected date
function showEventsForDate(date) {
    const dayEvents = events.filter(event => event.date === date);
    const eventsList = document.getElementById('eventsList');
    
    if (dayEvents.length > 0) {
        eventsList.innerHTML = dayEvents.map(event => `
            <div class="event-card">
                <h3>${event.title}</h3>
                <p><strong>Time:</strong> ${event.time}</p>
                <p><strong>Location:</strong> ${event.location}</p>
                <p>${event.description}</p>
                <button onclick="viewEventPhotos('${event.date}')" class="view-photos-btn">
                    View Photos 📸
                </button>
            </div>
        `).join('');
    } else {
        eventsList.innerHTML = '<p class="no-events">No events scheduled for this date</p>';
    }
}

// Change month
function changeMonth(direction) {
    currentMonth += direction;
    if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
    } else if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
    }
    generateCalendar(currentMonth, currentYear);
}

// View photos for specific event
function viewEventPhotos(eventDate) {
    const event = events.find(e => e.date === eventDate);
    if (event && event.photos) {
        alert(`Loading photos for ${event.title}\nPhotos: ${event.photos.join(', ')}`);
        // Here you can implement a photo modal viewer
    }
}

// Initialize calendar and load photos on page load
document.addEventListener('DOMContentLoaded', function() {
    generateCalendar(currentMonth, currentYear);
    loadPhotosFromDrive();
    
    // Show today's events by default
    const today = new Date().toISOString().split('T')[0];
    showEventsForDate(today);
});
</script>

<!-- Add this CSS to your style.css or in a style tag -->
<style>
.events-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.page-title {
    text-align: center;
    color: #333;
    margin-bottom: 30px;
}

/* Calendar Styles */
.calendar-section {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-bottom: 30px;
}

.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.month-nav {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 25px;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.3s;
}

.month-nav:hover {
    background: #764ba2;
    transform: scale(1.05);
}

.calendar-grid {
    width: 100%;
}

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 10px;
}

.days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
}

.day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f8f9fa;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    font-weight: 500;
}

.day:hover {
    background: #e9ecef;
    transform: scale(1.05);
}

.day.has-event {
    background: linear-gradient(135deg, #667eea20, #764ba220);
    border: 2px solid #667eea;
}

.event-dot {
    width: 6px;
    height: 6px;
    background: #f093fb;
    border-radius: 50%;
    position: absolute;
    bottom: 5px;
}

.day.empty {
    background: transparent;
    cursor: default;
}

/* Events List Styles */
.events-list-section {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    margin-bottom: 30px;
}

.events-list {
    display: grid;
    gap: 15px;
}

.event-card {
    background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    padding: 20px;
    border-radius: 10px;
    border-left: 5px solid #667eea;
    transition: all 0.3s;
}

.event-card:hover {
    transform: translateX(5px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
}

.event-card h3 {
    color: #333;
    margin-bottom: 10px;
}

.event-card p {
    margin: 5px 0;
    color: #666;
}

.view-photos-btn {
    background: #4facfe;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.3s;
}

.view-photos-btn:hover {
    background: #00f2fe;
    transform: translateY(-2px);
}

/* Photo Section Styles */
.photo-section {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

.photo-item {
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: all 0.3s;
    cursor: pointer;
}

.photo-item:hover {
    transform: scale(1.03);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.photo-item img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}

.photo-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    color: white;
    padding: 15px;
    transform: translateY(100%);
    transition: transform 0.3s;
}

.photo-item:hover .photo-info {
    transform: translateY(0);
}

.photo-info h4 {
    margin: 0 0 5px 0;
    font-size: 16px;
}

.photo-info p {
    margin: 0;
    font-size: 14px;
    opacity: 0.9;
}

.no-events {
    text-align: center;
    color: #999;
    font-style: italic;
    padding: 20px;
}

/* Responsive Design */
@media (max-width: 768px) {
    .category-nav {
        flex-direction: column;
        align-items: stretch;
    }
    
    .category-btn {
        justify-content: center;
    }
    
    .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    
    .photo-item img {
        height: 150px;
    }
}
</style>
